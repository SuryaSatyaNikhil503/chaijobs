# chaijobs daily digest. Runs in YOUR private instance repo, never in the public chaijobs repo.
name: chaijobs-daily

on:
  schedule:
    - cron: "37 1 * * *" # 01:37 UTC = 07:07 IST (off the top of the hour, when GitHub is busiest)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaijobs-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run chaijobs
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx --yes github:SuryaSatyaNikhil503/chaijobs#v0.1.0 run --instance .
      - name: Save job history
        if: always()
        run: |
          git config user.name "chaijobs"
          git config user.email "chaijobs@users.noreply.github.com"
          git add data/
          git commit -m "chore: daily run $(date -u +%F)" || exit 0
          git push
