# chaijobs daily digest. Runs in YOUR private instance repo, never in the public chaijobs repo.
#
# Supply-chain rules (do not loosen):
# - Every action and the chaijobs code itself are pinned to full commit SHAs; tags can be moved.
# - Install and build run in a step with NO secrets and with install scripts disabled.
# - Only the "Run chaijobs" step receives secrets.
name: chaijobs-daily

on:
  schedule:
    - cron: "37 1 * * *" # 01:37 UTC = 07:07 IST (off the top of the hour, when GitHub is busiest)
  workflow_dispatch:

permissions:
  contents: write # the last step commits data/ back to this repo

concurrency:
  group: chaijobs-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this instance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needed: save-state.sh pushes data/ back to this repo

      - name: Fetch chaijobs at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SuryaSatyaNikhil503/chaijobs
          ref: __CHAIJOBS_REF__
          path: .chaijobs-app
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install and build (no secrets in this step)
        working-directory: .chaijobs-app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run chaijobs
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .chaijobs-app/dist/cli.js run --instance .

      - name: Save job history
        if: always()
        run: bash .chaijobs-app/scripts/save-state.sh
